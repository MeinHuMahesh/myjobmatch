name: Refresh job snapshot

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Scrape the portal
        run: npm run scrape:force -- --no-details
        env:
          HEADLESS: "true"
          PW_CHANNEL: "chrome"
          SCRAPE_DETAILS: "false"
          DATABASE_PATH: ${{ github.workspace }}/db/jobs.db

      - name: Export snapshot
        run: npm run snapshot:export
        env:
          DATABASE_PATH: ${{ github.workspace }}/db/jobs.db

      - name: Validate snapshot
        run: npm run snapshot:validate

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/jobs.json public/data/meta.json
          if git diff --cached --quiet; then
            echo "No snapshot changes."
          else
            git commit -m "chore: refresh job snapshot $(date -u +%F)"
            git push origin HEAD:main
          fi
