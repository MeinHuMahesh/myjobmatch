name: Keep scheduled workflows active

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Commit timestamp if stale
        run: |
          set -euo pipefail
          file=".github/keepalive.txt"
          stale_days=45
          last_epoch=0
          if [ -f "$file" ]; then
            last_value=$(tr -d '[:space:]' < "$file")
            case "$last_value" in
              ''|*[!0-9]*) last_epoch=0 ;;
              *) last_epoch="$last_value" ;;
            esac
          fi
          now_epoch=$(date -u +%s)
          age_days=$(( (now_epoch - last_epoch) / 86400 ))
          if [ "$age_days" -lt "$stale_days" ]; then
            echo "Last keepalive ${age_days}d ago; no commit needed."
            exit 0
          fi
          echo "$now_epoch" > "$file"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$file"
          git commit -m "chore: keepalive $(date -u +%F)"
          git push origin HEAD:main
